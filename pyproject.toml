[project]
name = "typesafe-computer-use"
version = "0.1.0-hyprland"
description = "Cheap, fast computer use: deterministic screen state + TypeSafe Jev decisions. Hyprland/Linux port of awlevin/typesafe-computer-use."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Aaron Levin" }, { name = "Carter / ComCreate fork" }]
keywords = ["computer-use", "automation", "ocr", "typesafe", "hyprland", "linux", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "anthropic==1.6.0",
    "typesafe-sdk==0.6.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
macos = [
    "ocrmac==1.0.1",
    "pyobjc-framework-ApplicationServices==12.2.2",
    "pyobjc-framework-Quartz==12.2.2",
]
hyprland = [
    "pytesseract>=0.3.10",
]

[project.urls]
Homepage = "https://github.com/awlevin/typesafe-computer-use"
Upstream = "https://github.com/awlevin/typesafe-computer-use"

[project.scripts]
clicker = "typesafe_computer_use.cli:main"
clicker-inspect = "typesafe_computer_use.cli:inspect"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.8"]

[build-system]
requires = ["hatchling==1.32.1"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["typesafe_computer_use"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
